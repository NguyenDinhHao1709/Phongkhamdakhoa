name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            mobile-patient/package-lock.json

      - name: Install and build backend
        working-directory: backend
        run: npm ci && npm run build

      - name: Build AI service
        working-directory: ai-service
        run: npm install --no-package-lock && npm run build

      - name: Build office service
        working-directory: office-service
        run: npm install --no-package-lock && npm run build

      - name: Install and build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-ml/requirements.txt

      - name: Check Python service
        working-directory: python-ml
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q main.py services scripts
          python -m pip install pytest httpx
          python -m pytest tests -q

      - name: Validate compose configuration
        run: |
          cp deploy/staging.env.example deploy/.env
          cp deploy/backend.staging.env.example deploy/backend.staging.env
          cp deploy/ai-service.staging.env.example deploy/ai-service.staging.env
          cp deploy/office-service.staging.env.example deploy/office-service.staging.env
          cp deploy/python-ml.staging.env.example deploy/python-ml.staging.env
          docker compose --env-file deploy/.env -f deploy/docker-compose.staging.yml config --quiet
