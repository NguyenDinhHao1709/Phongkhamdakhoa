name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag to deploy, normally a commit SHA"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-images:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image_tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/phongkham/backend:${{ steps.meta.outputs.image_tag }}
      - uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/phongkham/ai-service:${{ steps.meta.outputs.image_tag }}
      - uses: docker/build-push-action@v6
        with:
          context: ./office-service
          file: ./office-service/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/phongkham/office-service:${{ steps.meta.outputs.image_tag }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/phongkham/frontend:${{ steps.meta.outputs.image_tag }}
      - uses: docker/build-push-action@v6
        with:
          context: ./python-ml
          file: ./python-ml/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/phongkham/python-ml:${{ steps.meta.outputs.image_tag }}

  deploy:
    needs: build-images
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$STAGING_HOST" >> ~/.ssh/known_hosts
      - name: Upload compose files
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" "mkdir -p ~/phongkham/deploy"
          scp deploy/docker-compose.staging.yml deploy/Caddyfile \
            "$STAGING_USER@$STAGING_HOST:~/phongkham/deploy/"
      - name: Deploy and smoke test
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          IMAGE_TAG: ${{ needs.build-images.outputs.image_tag }}
        run: |
          ssh "$STAGING_USER@$STAGING_HOST" "cd ~/phongkham && \
            sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/' deploy/.env && \
            docker compose --env-file deploy/.env -f deploy/docker-compose.staging.yml pull && \
            docker compose --env-file deploy/.env -f deploy/docker-compose.staging.yml up -d && \
            docker compose --env-file deploy/.env -f deploy/docker-compose.staging.yml ps"
          curl --retry 20 --retry-delay 5 --fail \
            "https://${{ secrets.STAGING_DOMAIN }}/api/health"
